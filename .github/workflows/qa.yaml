name: QA

on:
  workflow_dispatch:

  pull_request:
    branches:
      - master
      - v*

  push:
    branches:
      - master
      - v*

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']

    name: PHP ${{ matrix.php }}

    services:
      postgres:
        image: postgres:10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextras_migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nextras_migrations_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ppass"
          --health-interval 10s
          --health-start-period 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # PHP < 7.4 cannot authenticate with MySQL 8 default caching_sha2_password plugin
      # (retried: the health check passes while the image still runs its socket-only init server)
      - name: Allow mysql_native_password authentication
        run: |
          for i in $(seq 1 30); do
            mysql --host 127.0.0.1 --user root --password=root --execute "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root'" && exit 0
            sleep 2
          done
          exit 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, ctype, mysqli, pgsql, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Prepare Env
        run: |
          cp ./tests/drivers.sample.ini ./tests/drivers.ini
          composer install --no-interaction --no-progress

      - run: tests/run-unit.sh
      - run: tests/run-integration.sh
